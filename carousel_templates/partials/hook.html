{% extends "layouts/base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; height: 100%; gap: var(--space-lg);">
  <p class="body-text body-text--large" style="color: var(--color-gray-600);">
    {{ slide_data.body }}
  </p>

  <div style="flex: 1; display: flex; justify-content: center; align-items: center; margin: var(--space-xl) 0;">
    <div style="width: 440px; height: 440px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-hook-start), var(--accent-hook-mid), var(--accent-hook-end)); opacity: 0.15; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 160px;">🚀</span>
    </div>
  </div>

  <div class="handle-chip" style="--accent-color: {{ accent_color }}; align-self: flex-start;">
    <div class="handle-chip__avatar">VJ</div>
    <span>@vijayakumarj_ai</span>
  </div>
{% endblock %}
