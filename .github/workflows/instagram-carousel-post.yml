name: Instagram Carousel Post

on:
  schedule:
    # Peak engagement windows (IST)
    # Weekday mornings (commute) + afternoons + evenings
    - cron: '0 2 * * 1-5'   # 7:30 AM IST Mon-Fri
    - cron: '0 10 * * 1-5'  # 3:30 PM IST Mon-Fri
    - cron: '0 14 * * 1-5'  # 7:30 PM IST Mon-Fri
    # Weekend: later mornings, earlier evenings
    - cron: '0 4 * * 6,0'   # 9:30 AM IST Sat-Sun
    - cron: '0 12 * * 6,0'  # 5:30 PM IST Sat-Sun
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific "Did You Know" fact or topic (e.g., "99% of Internet is Underwater" or "Why GPS Needs Einstein")'
        required: false
        type: string
      style:
        description: 'Carousel visual style'
        required: false
        type: choice
        options:
          - cartoon_dialogue
          - code_editor
        default: cartoon_dialogue
      mode:
        description: 'Content mode'
        required: false
        type: choice
        options:
          - did_you_know
          - concept
          - news
          - auto
        default: did_you_know
      auto_post:
        description: 'Directly publish to Instagram'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  generate-and-post-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0"
          pip install "grpcio==1.62.2"
          pip install requests pillow python-dotenv pydantic jinja2 playwright python-telegram-bot aiohttp google-genai google-generativeai rapidfuzz
          
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('.github/workflows/instagram-carousel-post.yml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Setup Environment Secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env
          echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          if [ ! -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env; fi
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env

      - name: Fetch Trending Hashtags
        id: hashtags
        run: |
          python -u fetch_trending_hashtags.py --category "did_you_know" > hashtags.txt
          echo "hashtags=$(cat hashtags.txt)" >> $GITHUB_OUTPUT

      - name: Generate "Did You Know" Tech Carousel
        id: gen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          STYLE: ${{ github.event.inputs.style || 'cartoon_dialogue' }}
          MODE:  ${{ github.event.inputs.mode  || 'did_you_know' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -u generate_decorator_images.py --now \
            --topic "$TOPIC" --style "$STYLE" --mode "$MODE" \
            --hashtags-file hashtags.txt \
            --platform instagram

      - name: Post Carousel Directly to Instagram
        if: github.event_name == 'schedule' || github.event.inputs.auto_post != 'false'
        id: post_ig
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u post_to_instagram.py \
            --image "${{ steps.gen.outputs.ig_images }}" \
            --caption-file "${{ steps.gen.outputs.caption_file }}"

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: output/social_images/
          retention-days: 7

      - name: Commit Updated Logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash || true
          if [ -d "logs" ]; then git add -f logs/*.txt logs/*.json 2>/dev/null || true; fi
          if [ -d "output/social_images" ]; then git add -f output/social_images/*.json 2>/dev/null || true; fi
          if [ -f "instagram_carousel_log.json" ]; then git add instagram_carousel_log.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update Instagram carousel logs & metadata"
            for i in {1..3}; do git push origin main && exit 0; sleep 10; git pull origin main --rebase || true; done
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel-logs
          path: logs/
          retention-days: 7