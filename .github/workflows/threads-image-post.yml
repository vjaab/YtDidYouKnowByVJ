name: Threads Image Post

on:
  schedule:
    # Threads peak engagement windows (IST)
    # Weekday: lunch + late afternoon + evening
    - cron: '30 6 * * 1-5'   # 12:00 PM IST Mon-Fri
    - cron: '30 11 * * 1-5'  # 5:00 PM IST Mon-Fri
    - cron: '30 15 * * 1-5'  # 9:00 PM IST Mon-Fri
    # Weekend: late morning + afternoon
    - cron: '30 5 * * 6,0'   # 11:00 AM IST Sat-Sun
    - cron: '30 13 * * 6,0'  # 7:00 PM IST Sat-Sun
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific topic to generate (e.g., "OpenAI GPT-5")'
        required: false
        type: string
      style:
        description: 'Visual style (auto, swiss_editorial, cartoon_dialogue, side_by_side, bento_infographic, code_editor)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - swiss_editorial
          - cartoon_dialogue
          - side_by_side
          - bento_infographic
          - code_editor
      theme:
        description: 'Carousel visual theme'
        required: false
        type: choice
        options:
          - auto
          - monochrome_noir
          - paper_editorial
          - crimson_ember
          - emerald_terminal
          - luxury_gold
          - arctic_frost
          - tokyo_midnight
          - neon_cyber
          - cyber_matrix
          - tech_blueprint
          - amber_solaris
          - synthwave_plum
          - swiss_minimal
        default: auto
      characters:
        description: 'Mascot duo (auto or choose a gadget mascots)'
        required: false
        type: choice
        options:
          - auto
          - vj_byte
          - vj_phone
          - vj_computer
          - vj_watch
          - vj_chip
          - vj_camera
          - vj_earbuds
          - vj_battery
          - vj_vr
          - vj_server
          - vj_controller
          - vj_drone
        default: auto
      mode:
        description: 'Content mode (did_you_know, news, or auto)'
        required: false
        default: 'did_you_know'
        type: choice
        options:
          - did_you_know
          - news
          - auto
      auto_post:
        description: 'Directly post to Threads'
        required: false
        type: boolean
        default: true
      ai_flag:
        description: 'Mark media as Created with AI (is_ai_generated flag)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  threads-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0"
          pip install "grpcio==1.62.2"
          pip install requests pillow python-dotenv pydantic jinja2 playwright python-telegram-bot aiohttp google-generativeai google-genai rapidfuzz
          
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('.github/workflows/threads-image-post.yml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Setup Environment Secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}" >> .env
          echo "THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          if [ ! -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env; fi
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env
          echo "AI_FLAG=${{ github.event.inputs.ai_flag != 'false' }}" >> .env

      - name: Fetch Trending Hashtags
        id: hashtags
        run: |
          python -u fetch_trending_hashtags.py --category "did_you_know" > hashtags.txt
          echo "hashtags=$(cat hashtags.txt)" >> $GITHUB_OUTPUT

      - name: Generate "Did You Know" Tech Carousel
        id: gen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          STYLE: ${{ github.event.inputs.style || 'auto' }}
          THEME: ${{ github.event.inputs.theme || 'auto' }}
          CHARACTERS: ${{ github.event.inputs.characters || 'auto' }}
          MODE:  ${{ github.event.inputs.mode  || 'did_you_know' }}
          AI_FLAG: ${{ github.event.inputs.ai_flag != 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python -u generate_decorator_images.py --now \
            --topic "$TOPIC" --style "$STYLE" --theme "$THEME" --characters "$CHARACTERS" --mode "$MODE" \
            --hashtags-file hashtags.txt \
            --platform threads \
            --ai-flag "${{ github.event.inputs.ai_flag != 'false' }}"

      - name: Verify Content Accuracy & Auto-Approve Agent
        id: verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AI_FLAG: ${{ github.event.inputs.ai_flag != 'false' }}
        run: |
          python -u content_accuracy_agent.py \
            --platform threads \
            --carousel-json "${{ steps.gen.outputs.carousel_json }}" \
            --caption-file "${{ steps.gen.outputs.caption_file }}" \
            --topic "${{ steps.gen.outputs.topic }}" \
            --hashtags-file hashtags.txt \
            --style "${{ github.event.inputs.style || 'auto' }}" \
            --theme "${{ github.event.inputs.theme || 'auto' }}" \
            --characters "${{ github.event.inputs.characters || 'auto' }}" \
            --mode "${{ github.event.inputs.mode || 'did_you_know' }}" \
            --ai-flag "${{ github.event.inputs.ai_flag != 'false' }}"

      - name: Post Directly to Threads
        if: (github.event_name == 'schedule' || github.event.inputs.auto_post != 'false') && steps.verifier.outputs.approved == 'true'
        id: post_threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_FLAG: ${{ github.event.inputs.ai_flag != 'false' }}
        run: |
          python -u post_to_threads.py \
            --image "${{ steps.verifier.outputs.threads_images || steps.gen.outputs.threads_images }}" \
            --caption-file "${{ steps.verifier.outputs.caption_file || steps.gen.outputs.caption_file }}" \
            --topic "${{ steps.verifier.outputs.topic || steps.gen.outputs.topic }}"

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: output/social_images/
          retention-days: 7

      - name: Commit Updated Logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git pull origin main --rebase --autostash; then
            echo "⚠️ Rebase pull failed. Checking for merge conflicts..."
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "❌ Merge conflicts detected! Aborting rebase to prevent committing conflicts."
              git rebase --abort || echo "Rebase abort failed"
              exit 1
            fi
          fi
          if [ -d "logs" ]; then git add -f logs/*.txt logs/*.json 2>/dev/null || true; fi
          if [ -d "output/social_images" ]; then git add -f output/social_images/*.json 2>/dev/null || true; fi
          if [ -f ".threads_rate_limit.json" ]; then git add -f .threads_rate_limit.json; fi
          if [ -f "instagram_carousel_log.json" ]; then git add instagram_carousel_log.json; fi
          if [ -f "news_log.json" ]; then git add news_log.json; fi
          if [ -f "topic_tracker.json" ]; then git add topic_tracker.json; fi
          if grep -q "^<<<<<<<" news_log.json topic_tracker.json instagram_carousel_log.json 2>/dev/null; then
            echo "❌ Conflict markers found in JSON tracking files. Aborting commit."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update Threads carousel logs & metadata"
            for i in {1..3}; do
              if git push origin main; then exit 0; fi
              sleep 10
              if ! git pull origin main --rebase; then git rebase --abort || true; exit 1; fi
            done
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: threads-image-logs
          path: logs/
          retention-days: 7
