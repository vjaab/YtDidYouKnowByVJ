name: YouTube Hook Analytics Sync

on:
  schedule:
    # Run daily at 6 AM UTC (after videos have accumulated views)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days back to fetch analytics'
        required: false
        type: string
        default: '7'

permissions:
  contents: write  # for updating hook_video_map.json if needed

jobs:
  sync-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Setup YouTube Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          # Use saved analytics token if available
          if [ "${{ secrets.YOUTUBE_ANALYTICS_TOKEN_JSON }}" != "" ]; then
            echo '${{ secrets.YOUTUBE_ANALYTICS_TOKEN_JSON }}' > token_youtube_analytics.json
          fi

      - name: Run Analytics Sync
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
        run: |
          python -u hook_analytics_sync.py --days "${DAYS_BACK}"

      - name: Commit Updated Hook Analytics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash || true
          if [ -f "logs/hook_analytics.json" ]; then
            git add -f logs/hook_analytics.json
          fi
          if [ -f "logs/hook_video_map.json" ]; then
            git add -f logs/hook_video_map.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update hook analytics"
            for i in {1..3}; do git push origin main && exit 0; sleep 10; git pull origin main --rebase || true; done
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hook-analytics-logs
          path: logs/
          retention-days: 7