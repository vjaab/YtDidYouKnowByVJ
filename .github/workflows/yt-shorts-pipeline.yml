name: Daily Tech News Shorts Pipeline

on:
  schedule:
    # AUDIENCE-OPTIMIZED SCHEDULE (EST → UTC conversion, UTC-5)
    # Weekdays (Mon-Fri): 11 AM & 7 PM EST → 16:00 & 00:00 UTC
    - cron: '0 16 * * 1-5'  # Mon-Fri 11:00 AM EST
    - cron: '0 0 * * 2-6'   # Tue-Sat 12:00 AM UTC (Mon-Fri 7:00 PM EST)
    # Weekends (Sat-Sun): 10 AM & 3 PM EST → 15:00 & 20:00 UTC
    - cron: '0 15 * * 6,0'  # Sat-Sun 10:00 AM EST
    - cron: '0 20 * * 6,0'  # Sat-Sun 3:00 PM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no uploads)'
        type: boolean
        default: false
      topic_type:
        description: 'Topic type to generate'
        type: choice
        options:
          - auto
          - research
          - tools
          - news
          - tech_trends
          - vaibhav
          - interview_questions
        default: auto

concurrency:
  group: yt-shorts-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto libglib2.0-0 libsm6 libxext6 libxrender1 espeak-ng wget jq

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Install Project Python Dependencies
        env:
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0" "grpcio==1.62.2"
          pip install --no-build-isolation openai-whisper==20240930
          pip install -r requirements.txt
          pip install python-dotenv
          pip install --upgrade imageio imageio-ffmpeg moviepy

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Setup Environment Secrets (.env)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "TELEGRAM_CHANNEL_USERNAME=${{ secrets.TELEGRAM_CHANNEL_USERNAME }}" >> .env
          echo "THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}" >> .env
          echo "THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}" >> .env
          if [ ! -z "${{ secrets.THREADS_APP_ID }}" ]; then echo "THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.THREADS_APP_SECRET }}" ]; then echo "THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}" >> .env; fi
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> .env
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> .env
          echo "KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }}" >> .env
          echo "KAGGLE_KEY=${{ secrets.KAGGLE_KEY }}" >> .env
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> .env
          echo "X_API_SECRET=${{ secrets.X_API_SECRET }}" >> .env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> .env
          echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> .env
          echo "X_BEARER_TOKEN=${{ secrets.X_BEARER_TOKEN }}" >> .env
          echo "REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}" >> .env
          echo "REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}" >> .env
          echo "YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}" >> .env
          if [ ! -z "${{ secrets.IG_VIDEO_PUBLIC_URL }}" ]; then echo "IG_VIDEO_PUBLIC_URL=${{ secrets.IG_VIDEO_PUBLIC_URL }}" >> .env; fi
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          if [ ! -z "${{ secrets.OPENAI_API_KEY }}" ]; then echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.GROQ_API_KEY }}" ]; then echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.CEREBRAS_API_KEY }}" ]; then echo "CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.VIDIQ_API_KEY }}" ]; then echo "VIDIQ_API_KEY=${{ secrets.VIDIQ_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.OPENCODE_API_KEY }}" ]; then echo "OPENCODE_API_KEY=${{ secrets.OPENCODE_API_KEY }}" >> .env; fi
          if [ ! -z "${{ secrets.IG_USER_ID }}" ]; then echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.IG_ACCESS_TOKEN }}" ]; then echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env; fi
          if [ ! -z "${{ secrets.INSTAGRAM_APP_ID }}" ]; then echo "INSTAGRAM_APP_ID=${{ secrets.INSTAGRAM_APP_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.INSTAGRAM_APP_SECRET }}" ]; then echo "INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET }}" >> .env; fi
          if [ ! -z "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" ]; then echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env; fi
          if [ ! -z "${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" ]; then echo "INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.FB_PAGE_ID }}" ]; then echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.FB_PAGE_ACCESS_TOKEN }}" ]; then echo "FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}" >> .env; fi
          if [ ! -z "${{ secrets.FB_GROUP_IDS }}" ]; then echo "FB_GROUP_IDS=${{ secrets.FB_GROUP_IDS }}" >> .env; fi

      - name: Setup YouTube Auth Files
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python3 scripts/ci_setup_youtube_auth.py

      - name: Setup YouTube Analytics Token
        env:
          YOUTUBE_ANALYTICS_TOKEN_JSON: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_JSON }}
        run: |
          if [ -n "${YOUTUBE_ANALYTICS_TOKEN_JSON}" ]; then
            python3 scripts/ci_setup_analytics_token.py
          else
            echo "⚠️ YOUTUBE_ANALYTICS_TOKEN_JSON not set, skipping analytics token setup"
          fi

      - name: Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/ci_setup_kaggle.py

      - name: Run Pipeline (Kaggle GPU Priority)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          ORT_LOG_LEVEL: ERROR
          CI_LITE: "1"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TOPIC_TYPE: ${{ github.event.inputs.topic_type }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          TOPIC_TYPE="${TOPIC_TYPE:-auto}"
          python -u main.py --now --type "$TOPIC_TYPE" $DRY_RUN_FLAG

      - name: Platform-Native Optimization & A/B Test Setup
        if: always()
        run: |
          echo "🔧 Running platform-native optimization..."
          if [ -d "output" ]; then
            find output -name "*_abtest.json" -type f | head -20 | while read f; do
              echo "📊 Found A/B test metadata: $f"
              cat "$f" | jq . 2>/dev/null || cat "$f"
            done
          fi
          python3 scripts/platform_optimization.py
          python3 scripts/validate_thumbnails.py

      - name: Upload Optimization Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-optimization-report
          path: |
            output/*_abtest.json
            output/platform_optimization_report.json
          retention-days: 30

      - name: Analytics Sync & Health Check
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/ci_analytics_check.py

      - name: Commit Updated Tracking File & Logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if ! git pull origin main --rebase --autostash; then
            echo "⚠️ Rebase pull failed. Checking for merge conflicts..."
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "❌ Merge conflicts detected! Aborting rebase to prevent committing conflicts."
              git rebase --abort || echo "Rebase abort failed"
              exit 1
            else
              echo "Pull failed for other reasons, proceeding..."
            fi
          fi
          for f in news_log.json facts_log.json layout_tracker.json series_tracker.json .topic_index.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -d "logs" ]; then
            git add -f logs/*.txt 2>/dev/null || true
            git add -f logs/*.json 2>/dev/null || true
          fi
          if grep -q "^<<<<<<<" news_log.json facts_log.json 2>/dev/null; then
            echo "❌ Conflict markers found in news_log.json or facts_log.json. Aborting commit."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update news tracker logs"
            for i in {1..5}; do
              echo "Attempt $i to push changes..."
              if git push origin main; then echo "✅ Successfully pushed logs."; exit 0; fi
              echo "⚠️ Push failed, syncing and retrying..."
              sleep 10
              if ! git pull origin main --rebase; then echo "⚠️ Sync failed, aborting rebase..."; git rebase --abort || true; exit 1; fi
            done
            echo "❌ Failed to push logs after 5 attempts."
          else
            echo "✅ No changes to logs detected."
          fi

      - name: Failure Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="❌ *Daily Shorts Pipeline Failed*\nRun: ${RUN_URL}\nCommit: ${{ github.sha }}\nCheck the workflow logs for details."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" -d parse_mode="Markdown" -d disable_web_page_preview=true
            echo "📱 Failure notification sent to Telegram"
          else
            echo "⚠️ Telegram credentials not configured, skipping failure notification"
          fi

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            logs/
            output/
          retention-days: 7