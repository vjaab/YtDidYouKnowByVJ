name: Cleanup GitHub Releases

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required to delete releases

jobs:
  cleanup:
    name: Cleanup Old Media Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update && sudo apt install -y gh

      - name: Cleanup old media-temp releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Finding releases older than 24 hours with 'media-temp-' tag..."
          
          # Get all releases with media-temp- tag
          releases=$(gh api repos/vjaab/YtDidYouKnowByVJ/releases --paginate --jq '.[] | select(.tag_name | startswith("media-temp-")) | {id: .id, tag_name: .tag_name, created_at: .created_at, draft: .draft, prerelease: .prerelease}')
          
          if [ -z "$releases" ]; then
            echo "ℹ️ No media-temp releases found"
            exit 0
          fi
          
          echo "$releases" | jq -c '.' | while read -r release; do
            id=$(echo "$release" | jq -r '.id')
            tag_name=$(echo "$release" | jq -r '.tag_name')
            created_at=$(echo "$release" | jq -r '.created_at')
            draft=$(echo "$release" | jq -r '.draft')
            prerelease=$(echo "$release" | jq -r '.prerelease')
            
            # Parse creation time and compare with 24 hours ago
            created_epoch=$(date -d "$created_at" +%s)
            cutoff_epoch=$(date -d '24 hours ago' +%s)
            
            echo "📋 Found: $tag_name (ID: $id, created: $created_at, draft: $draft, prerelease: $prerelease)"
            
            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "🗑️ Deleting $tag_name (older than 24 hours)..."
              if gh api -X DELETE "repos/vjaab/YtDidYouKnowByVJ/releases/$id"; then
                echo "✅ Deleted release $tag_name"
              else
                echo "⚠️ Failed to delete release $tag_name"
              fi
            else
              echo "⏭️ Keeping $tag_name (created less than 24 hours ago)"
            fi
          done
          
          echo "✅ Cleanup complete"