name: Instagram Facebook Telegram Image Post

on:
  schedule:
    # Peak engagement windows (IST)
    # Weekday mornings (commute) + afternoons + evenings
    - cron: '0 2 * * 1-5'   # 7:30 AM IST Mon-Fri
    - cron: '0 10 * * 1-5'  # 3:30 PM IST Mon-Fri
    - cron: '0 14 * * 1-5'  # 7:30 PM IST Mon-Fri
    # Weekend: later mornings, earlier evenings
    - cron: '0 4 * * 6,0'   # 9:30 AM IST Sat-Sun
    - cron: '0 12 * * 6,0'  # 5:30 PM IST Sat-Sun
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific topic to generate'
        required: false
        type: string
      category:
        description: 'Category for trending topic (when no topic specified)'
        required: false
        type: string
        default: 'AI & Tech Tools'
      auto_post:
        description: 'Auto-post after Telegram approval'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      topic: ${{ steps.gen.outputs.topic }}
      ig_images: ${{ steps.gen.outputs.ig_images }}
      fb_images: ${{ steps.gen.outputs.fb_images }}
      caption_file: ${{ steps.gen.outputs.caption_file }}
      hashtags: ${{ steps.hashtags.outputs.hashtags }}
      poll_file: ${{ steps.gen.outputs.poll_file }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0"
          pip install "grpcio==1.62.2"
          pip install requests pillow python-dotenv pydantic jinja2 playwright python-telegram-bot aiohttp

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Setup Environment Secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env
          echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env
          echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}" >> .env
          echo "FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}" >> .env
          # X/Twitter and LinkedIn posting disabled
          # echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> .env
          # echo "X_API_SECRET=${{ secrets.X_API_SECRET }}" >> .env
          # echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> .env
          # echo "X_ACCESS_SECRET=${{ secrets.X_ACCESS_SECRET }}" >> .env
          # echo "LINKEDIN_ACCESS_TOKEN=${{ secrets.LINKEDIN_ACCESS_TOKEN }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env

      - name: Determine Trending Category
        id: category
        run: |
          # For scheduled runs, pick category based on UTC time (approximating IST windows)
          # GitHub Actions cron runs in UTC
          # 02:00 UTC = 07:30 IST (morning)
          # 10:00 UTC = 15:30 IST (afternoon) 
          # 14:00 UTC = 19:30 IST (evening)
          # 04:00 UTC = 09:30 IST (weekend morning)
          # 12:00 UTC = 17:30 IST (weekend evening)
          
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            HOUR=$(date -u +%H)
            DAY=$(date -u +%u)  # 1=Mon, 7=Sun
            
            if [[ $DAY -ge 1 && $DAY -le 5 ]]; then
              # Weekday
              if [[ $HOUR -eq 02 ]]; then
                CATEGORY="AI & Tech Tools"
              elif [[ $HOUR -eq 10 ]]; then
                CATEGORY="Tech Gadgets & Inventions"
              elif [[ $HOUR -eq 14 ]]; then
                CATEGORY="Coding & Development Hacks"
              else
                CATEGORY="AI & Tech Tools"
              fi
            else
              # Weekend
              if [[ $HOUR -eq 04 ]]; then
                CATEGORY="Facts & Trivia"
              elif [[ $HOUR -eq 12 ]]; then
                CATEGORY="Finance & Tech Economy"
              else
                CATEGORY="AI & Tech Tools"
              fi
            fi
          else
            # Manual dispatch - use input or default
            CATEGORY="${{ github.event.inputs.category || 'AI & Tech Tools' }}"
          fi
          
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT
          echo "Selected category: $CATEGORY"

      - name: Fetch Trending Hashtags
        id: hashtags
        run: |
          python -u fetch_trending_hashtags.py --category "${{ steps.category.outputs.category }}" > hashtags.txt
          echo "hashtags=$(cat hashtags.txt)" >> $GITHUB_OUTPUT

      - name: Generate Images
        id: gen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          TRENDING_CATEGORY: ${{ steps.category.outputs.category }}
        run: |
          python -u generate_decorator_images.py --now \
            --topic "${{ github.event.inputs.topic || '' }}" \
            --hashtags-file hashtags.txt

      - name: Send to Telegram for Approval
        if: github.event.inputs.auto_post == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u telegram_approval_handler.py --send-for-approval \
            --topic "${{ steps.gen.outputs.topic }}" \
            --ig-images "${{ steps.gen.outputs.ig_images }}" \
            --fb-images "${{ steps.gen.outputs.fb_images }}" \
            --caption-file "${{ steps.gen.outputs.caption_file }}" \
            --poll-file "${{ steps.gen.outputs.poll_file }}"

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: output/social_images/
          retention-days: 7

  auto-post:
    needs: generate-images
    if: github.event.inputs.auto_post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Wait for Telegram approval (polling)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Generated Images
        uses: actions/download-artifact@v4
        with:
          name: generated-images
          path: output/social_images/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv aiohttp

      - name: Wait for Telegram Approval & Post
        id: approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # X/Twitter and LinkedIn posting disabled
          # X_API_KEY: ${{ secrets.X_API_KEY }}
          # X_API_SECRET: ${{ secrets.X_API_SECRET }}
          # X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          # X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -u telegram_approval_handler.py --wait-and-post \
            --topic "${{ needs.generate-images.outputs.topic }}" \
            --ig-images "${{ needs.generate-images.outputs.ig_images }}" \
            --fb-images "${{ needs.generate-images.outputs.fb_images }}" \
            --caption-file "${{ needs.generate-images.outputs.caption_file }}" \
            --hashtags "${{ needs.generate-images.outputs.hashtags }}" \
            --poll-file "${{ needs.generate-images.outputs.poll_file }}" \
            --timeout 3600

      - name: Check Approval Result
        if: always()
        run: |
          ACTION="${{ steps.approval.outputs.approval_action }}"
          echo "Approval action: $ACTION"
          if [ "$ACTION" = "reject" ]; then
            echo "❌ Posting rejected by user"
            exit 1
          elif [ "$ACTION" = "timeout" ]; then
            echo "⏰ Approval timed out"
            exit 1
          elif [ "$ACTION" = "regenerate" ]; then
            echo "🔄 Regeneration requested"
            exit 2
          elif [ -z "$ACTION" ]; then
            echo "⚠️ No approval action recorded"
            exit 1
          fi

      - name: Track Engagement (after 1 hour)
        if: success()
        run: |
          python -u track_engagement.py --topic "${{ needs.generate-images.outputs.topic }}" --delay 3600

  commit-logs:
    needs: [generate-images, auto-post]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Commit Updated Logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash || true
          if [ -d "logs" ]; then git add -f logs/*.txt logs/*.json 2>/dev/null || true; fi
          if [ -d "output/social_images" ]; then git add -f output/social_images/*.json 2>/dev/null || true; fi
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update image post logs & metadata"
            for i in {1..3}; do git push origin main && exit 0; sleep 10; git pull origin main --rebase || true; done
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-post-logs
          path: logs/
          retention-days: 7