name: Instagram Facebook Telegram Image Post

on:
  schedule:
    # Daily at 9:00 AM IST (03:30 UTC)
    - cron: '30 3 * * *'
    # Daily at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for GITHUB_TOKEN to create releases (Instagram image hosting)

jobs:
  post-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0"
          pip install "grpcio==1.62.2"
          pip install google-genai google-generativeai requests pillow python-dotenv

      - name: Setup Environment Secrets (.env)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          # Instagram/Facebook credentials for image/carousel posting
          if [ ! -z "${{ secrets.IG_USER_ID }}" ]; then echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.IG_ACCESS_TOKEN }}" ]; then echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env; fi
          if [ ! -z "${{ secrets.FB_PAGE_ID }}" ]; then echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}" >> .env; fi
          if [ ! -z "${{ secrets.FB_PAGE_ACCESS_TOKEN }}" ]; then echo "FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}" >> .env; fi

      - name: Run Image Generation & Posting Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ORT_LOG_LEVEL: ERROR
        run: |
          python -u post_image.py --now

      - name: Commit Updated Logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes
          git pull origin main --rebase --autostash || true
          
          # Add any log files that may have been generated
          if [ -d "logs" ]; then
            git add -f logs/*.txt logs/*.json 2>/dev/null || true
          fi
          
          # Only commit if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "[Bot] Auto-update image post logs"
            
            # Retry push up to 3 times
            for i in {1..3}; do
              echo "Attempt $i to push changes..."
              if git push origin main; then
                echo "✅ Successfully pushed logs."
                exit 0
              fi
              echo "⚠️ Push failed, syncing and retrying..."
              sleep 10
              git pull origin main --rebase || true
            done
            echo "❌ Failed to push logs after 3 attempts."
          else
            echo "✅ No changes to commit."
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-post-logs
          path: logs/
          retention-days: 7