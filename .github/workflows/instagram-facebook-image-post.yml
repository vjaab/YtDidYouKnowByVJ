                'Scaling: sharding, replication, multi-tenancy'
            ]
        },
        {
            'topic': 'Building AI Coding Assistants',
            'audience': 'Software engineers and students',
            'key_points': [
                'Context: repo map, open files, git history',
                'Completion: in-line suggestions, multi-line',
                'Chat: explain, refactor, debug, test gen',
                'RAG: codebase indexing + semantic search',
                'Agents: autonomous task execution',
                'Evaluation: HumanEval, MBPP, real-world benchmarks'
            ]
        },
        {
            'topic': 'Multimodal AI: Vision + Language',
            'audience': 'AI researchers and product builders',
            'key_points': [
                'Architecture: vision encoder + LLM adapter',
                'Training: image-text pairs, interleaved data',
                'Capabilities: OCR, chart reading, UI understanding',
                'Models: GPT-4V, Claude 3, Llava, Qwen-VL',
                'Use cases: document QA, code from screenshots',
                'Challenges: hallucination, resolution, latency'
            ]
        },
        {
            'topic': 'AI Privacy: Local-First Architecture',
            'audience': 'Security engineers and privacy advocates',
            'key_points': [
                'On-device inference: no cloud API calls',
                'Data never leaves user machine',
                'Federated learning: train locally, aggregate globally',
                'TEEs: hardware enclaves for sensitive compute',
                'Private RAG: local vector DB + local LLM',
                'Compliance: GDPR, HIPAA, SOC2 by design'
            ]
        },
        {
            'topic': 'System Design for AI Applications',
            'audience': 'Senior engineers and architects',
            'key_points': [
                'Ingestion: chunking, embedding, indexing pipeline',
                'Serving: model serving, batching, caching',
                'Observability: latency, token usage, quality metrics',
                'Guardrails: PII detection, hallucination checks',
                'Cost optimization: model routing, caching, quantization',
                'CI/CD: eval pipelines, regression testing, canary'
            ]
        },
        {
            'topic': 'Interview Prep: AI System Design Questions',
            'audience': 'Job seekers and interview candidates',
            'key_points': [
                'Clarify: scale, latency, accuracy requirements',
                'Data: sources, volume, freshness, privacy',
                'Model: build vs buy, open vs closed, eval criteria',
                'Architecture: RAG, agents, fine-tuning, hybrid',
                'Scaling: sharding, caching, async processing',
                'Monitoring: drift detection, A/B testing, feedback loops'
            ]
        }
    ]
    
    selected = random.choice(ai_topics)
    topic = selected['topic']
    audience = selected['audience']
    key_points = selected['key_points']
    print(f'Generating content for: {topic}')
    
    # Generate an AI image using our image generation pipeline
    image_path = os.path.join(OUTPUT_DIR, f'ai_content_{datetime.now().strftime("%Y%m%d_%H%M%S")}.png')
    
    # Create professional educational infographic prompt
    key_points_str = chr(10).join(f'- {point}' for point in key_points)
    educational_prompt = f"""Create a professional educational infographic for AI-powered learning content platform.

Topic: {topic}
Target audience: {audience}

Key concepts to visualize:
{key_points_str}

Design requirements:
- Clean, premium technology/education aesthetic
- Modern educational infographic, understandable within seconds
- Strong visual hierarchy: Topic → Core Concept → Key Points → Practical Takeaway
- Clear headline, simple diagrams, icons, flow arrows, visual metaphors
- Short labels instead of paragraphs, technically accurate terminology
- Professional color palette for technology and education
- AI/technology elements: neural networks, code snippets, data flows, cloud architecture
- Uncluttered, high-quality, sharp, polished appearance
- 16:9 aspect ratio optimized for digital publishing
- No watermarks, stock-photo aesthetics, or irrelevant objects

Educational objective: Viewer understands {topic} and why it matters by looking at the image.

High-resolution 16:9 educational infographic for LinkedIn, Instagram, YouTube, educational blogs."""
    
    # Use the image generation function (returns list of paths)
    results = generate_images(
        prompts=[educational_prompt],
        aspect_ratio="16:9"
    )
    
    if results and len(results) > 0 and results[0] and os.path.exists(results[0]):
        final_image = results[0]
    else:
        # Fallback: create a professional 16:9 educational infographic
        from PIL import Image, ImageDraw, ImageFont
        # 16:9 aspect ratio for digital publishing
        img = Image.new('RGB', (1920, 1080), color='#0d1117')
        draw = ImageDraw.Draw(img)
        # Draw professional gradient background
        for y in range(1080):
            r = int(13 + (30 - 13) * y / 1080)
            g = int(17 + (58 - 17) * y / 1080)
            b = int(23 + (138 - 23) * y / 1080)
            draw.line([(0, y), (1920, y)], fill=(r, g, b))
        # Add topic headline
        try:
            font_title = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 56)
            font_body = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 28)
        except:
            font_title = ImageFont.load_default()
            font_body = ImageFont.load_default()
        # Title
        title_text = topic
        bbox = draw.textbbox((0, 0), title_text, font=font_title)
        tw = bbox[2] - bbox[0]
        draw.text(((1920-tw)//2, 120), title_text, font=font_title, fill='white')
        # Subtitle
        sub_text = f"Target: {audience}"
        bbox = draw.textbbox((0, 0), sub_text, font=font_body)
        tw = bbox[2] - bbox[0]
        draw.text(((1920-tw)//2, 200), sub_text, font=font_body, fill='#a5b4fc')
        # Key points as visual list
        y_pos = 300
        for i, point in enumerate(key_points[:5]):
            # Bullet point
            draw.circle([150, y_pos + 14], 8, fill='#60a5fa')
            # Text
            point_text = point[:80] + ('...' if len(point) > 80 else '')
            draw.text((180, y_pos), point_text, font=font_body, fill='#e0e7ff')
            y_pos += 60
        # Footer
        footer = "AI Education Daily | Understand AI in seconds"
        bbox = draw.textbbox((0, 0), footer, font=font_body)
        tw = bbox[2] - bbox[0]
        draw.text(((1920-tw)//2, 980), footer, font=font_body, fill='#64748b')
        img.save(image_path)
        final_image = image_path
        print(f'Created fallback 16:9 educational infographic: {final_image}')
    
    # Generate educational caption matching the topic
    caption = f"""🎓 {topic}

{chr(10).join(f'🔹 {point}' for point in key_points[:4])}

Understanding this concept is essential for {audience.lower()}. The visual breaks down the core components so you can grasp it in seconds.

Save this for your learning journey! 📚

#AI #ArtificialIntelligence #MachineLearning #AIEducation #TechEducation #LearnAI #SoftwareEngineering #DataScience #GenerativeAI #LLM #RAG #VectorDatabase #SystemDesign #InterviewPrep #DailyLearning #TechEducation"""
    
    # Set outputs
    with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
        f.write(f'image_path={final_image}\n')
        f.write(f'caption={caption}\n')
        f.write(f'post_to_instagram=true\n')
        f.write(f'post_to_facebook=true\n')
    print(f'Generated: {final_image}')
    print(f'Caption: {caption[:100]}...')
    
except Exception as e:
    print(f'Error generating content: {e}')
    # Create a simple fallback
    from PIL import Image, ImageDraw, ImageFont
    OUTPUT_DIR = os.getenv('OUTPUT_DIR', 'output')
    os.makedirs(OUTPUT_DIR, exist_ok=True)
    final_image = os.path.join(OUTPUT_DIR, f'ai_daily_{datetime.now().strftime(\"%Y%m%d\")}.png')
    img = Image.new('RGB', (1080, 1080), color='#0d1117')
    draw = ImageDraw.Draw(img)
    for y in range(1080):
        r = int(13 + (88 - 13) * y / 1080)
        g = int(17 + (166 - 17) * y / 1080)
        b = int(23 + (255 - 23) * y / 1080)
        draw.line([(0, y), (1080, y)], fill=(r, g, b))
    try:
        font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 48)
    except:
        font = ImageFont.load_default()
    text = 'AI Daily'
    bbox = draw.textbbox((0, 0), text, font=font)
    tw = bbox[2] - bbox[0]
    th = bbox[3] - bbox[1]
    draw.text(((1080-tw)//2, (1080-th)//2), text, font=font, fill='white')
    img.save(final_image)
    
    caption = '🚀 Daily AI Content: The future of technology is unfolding before our eyes. AI agents, local LLMs, and open-source tools are democratizing innovation. What are you building?\n\n#AI #ArtificialIntelligence #MachineLearning #TechNews #OpenSource #LLM #AITools #FutureTech #DailyAI #Innovation'
    
    with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
        f.write(f'image_path={final_image}\n')
        f.write(f'caption={caption}\n')
        f.write(f'post_to_instagram=true\n')
        f.write(f'post_to_facebook=true\n'
"

  post-to-instagram:
    needs: generate-content
    if: needs.generate-content.outputs.post_to_instagram == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests pillow

      - name: Upload Image to Instagram
        run: |
          python -c "
import os
import sys
sys.path.append('.')
from instagram_upload import upload_reel_to_instagram

# For images, we use the same Reels endpoint with image_url
# But Instagram requires video for Reels, so we'll use the image as a carousel post
# Let's use the image directly via the media endpoint

image_path = '${{ needs.generate-content.outputs.image_path }}'
caption = '''${{ needs.generate-content.outputs.caption }}'''

print(f'Posting to Instagram: {image_path}')
print(f'Caption: {caption[:100]}...')

# The instagram_upload module uses video upload via GitHub Releases
# For images, we can use the same hosting approach but with image content type
# Or use the IG_VIDEO_PUBLIC_URL if we have a pre-hosted image

# Since our module is designed for video Reels, let's adapt it for image
# We'll upload the image to GitHub Releases and use the image container endpoint

import requests
import time

ig_user_id = os.getenv('IG_USER_ID')
access_token = os.getenv('IG_ACCESS_TOKEN')
GRAPH_API_BASE = 'https://graph.facebook.com/v25.0'

# First, upload image to GitHub Releases for public URL
import subprocess
result = subprocess.run(['gh', 'release', 'create', f'ai-img-{int(time.time())}', image_path, 
    '--repo', os.getenv('GITHUB_REPOSITORY'),
    '--title', 'AI Daily Image',
    '--notes', 'Auto-generated for Instagram image post'],
    capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': os.getenv('GITHUB_TOKEN')})

if result.returncode != 0:
    print(f'GitHub release failed: {result.stderr}')
    sys.exit(1)

# Get the asset URL
import json
releases = subprocess.run(['gh', 'release', 'list', '--repo', os.getenv('GITHUB_REPOSITORY'), '--json', 'assets'],
    capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': os.getenv('GITHUB_TOKEN')})
releases_data = json.loads(releases.stdout)
latest_release = releases_data[0] if releases_data else None
if not latest_release or not latest_release.get('assets'):
    print('No assets found')
    sys.exit(1)

image_url = latest_release['assets'][0]['url']
print(f'Image URL: {image_url}')

# Create IMAGE container (not REELS)
container_resp = requests.post(
    f'{GRAPH_API_BASE}/{ig_user_id}/media',
    data={
        'media_type': 'IMAGE',
        'image_url': image_url,
        'caption': caption[:2200],
        'access_token': access_token,
    },
    timeout=30
)
container_resp.raise_for_status()
container_id = container_resp.json()['id']
print(f'Container created: {container_id}')

# Publish
publish_resp = requests.post(
    f'{GRAPH_API_BASE}/{ig_user_id}/media_publish',
    data={'creation_id': container_id, 'access_token': access_token},
    timeout=30
)
publish_resp.raise_for_status()
media_id = publish_resp.json()['id']
print(f'Instagram Image published! ID: {media_id}')
"

  post-to-facebook:
    needs: generate-content
    if: needs.generate-content.outputs.post_to_facebook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests pillow

      - name: Post to Facebook Page
        run: |
          python -c "
import os
import sys
import subprocess
import json
import time
import requests
sys.path.append('.')

from facebook_upload import post_video_to_facebook_page_fallback

image_path = '${{ needs.generate-content.outputs.image_path }}'
caption = '''${{ needs.generate-content.outputs.caption }}'''

print(f'Posting to Facebook: {image_path}')

# Upload image to GitHub Releases for public URL
result = subprocess.run(['gh', 'release', 'create', f'ai-fb-img-{int(time.time())}', image_path, 
    '--repo', os.getenv('GITHUB_REPOSITORY'),
    '--title', 'AI Daily FB Image',
    '--notes', 'Auto-generated for Facebook image post'],
    capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': os.getenv('GITHUB_TOKEN')})

if result.returncode != 0:
    print(f'GitHub release failed: {result.stderr}')
    sys.exit(1)

# Get the asset URL
releases = subprocess.run(['gh', 'release', 'list', '--repo', os.getenv('GITHUB_REPOSITORY'), '--json', 'assets'],
    capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': os.getenv('GITHUB_TOKEN')})
releases_data = json.loads(releases.stdout)
latest_release = releases_data[0] if releases_data else None
if not latest_release or not latest_release.get('assets'):
    print('No assets found')
    sys.exit(1)

image_url = latest_release['assets'][0]['url']
print(f'Image URL: {image_url}')

# Use fallback /videos endpoint for image (will post as photo)
# Facebook's /videos endpoint with file_url works for images too
fb_page_id = os.getenv('FB_PAGE_ID')
fb_page_access_token = os.getenv('FB_PAGE_ACCESS_TOKEN')
GRAPH_API_BASE = 'https://graph.facebook.com/v25.0'

fallback_payload = {
    'file_url': image_url,
    'description': caption[:2200],
    'published': 'true',
    'access_token': fb_page_access_token,
}

resp = requests.post(
    f'{GRAPH_API_BASE}/{fb_page_id}/videos',
    data=fallback_payload,
    timeout=60
)
print(f'Facebook response: {resp.status_code} - {resp.text}')
if resp.status_code == 200:
    video_id = resp.json().get('id')
    print(f'Facebook post published! ID: {video_id}')
else:
    print(f'Failed: {resp.text}')
    sys.exit(1)
"

  cleanup:
    needs: [post-to-instagram, post-to-facebook]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Cleanup old GitHub Releases (older than 7 days)
        run: |
          # Clean up old media-temp-* and ai-img-* releases
          gh release list --repo ${{ github.repository }} --json tagName,createdAt --limit 100 | \
          jq -r '.[] | select(.tagName | startswith("media-temp-") or startswith("ai-img-") or startswith("ai-fb-img-")) | select((now - (.createdAt | fromdateiso8601)) > 604800) | .tagName' | \
          xargs -r -I {} gh release delete {} --repo ${{ github.repository }} --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}