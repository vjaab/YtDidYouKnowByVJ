            'audience': 'ML engineers and tech leads',
            'key_points': [
                'RAG: Dynamic knowledge, lower cost, easy updates',
                'Fine-tuning: Style/tone, domain behavior, fixed knowledge',
                'RAG latency: retrieval + generation',
                'Fine-tuning: one-time compute, fast inference',
                'Hybrid: RAG for facts + fine-tune for style',
                'Decision: Data volatility vs. behavior customization'
            ]
        },
        {
            'topic': 'Vector Databases Explained Simply',
            'audience': 'Backend developers and data engineers',
            'key_points': [
                'Embeddings: text → high-dimensional vectors',
                'Similarity: cosine / dot product / L2 distance',
                'Index types: HNSW, IVF, Flat, PQ',
                'Popular DBs: Pinecone, Weaviate, Qdrant, Chroma',
