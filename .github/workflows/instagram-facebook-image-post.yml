name: Instagram & Facebook AI Content Post

on:
  schedule:
    # Daily at 10:00 AM IST (04:30 UTC) - prime engagement time for AI/tech content
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Path to image/video to post (relative to repo root)'
        required: false
        type: string
      caption:
        description: 'Custom caption for the post'
        required: false
        type: string
      post_to_instagram:
        description: 'Post to Instagram?'
        required: false
        type: boolean
        default: true
      post_to_facebook:
        description: 'Post to Facebook?'
        required: false
        type: boolean
        default: true

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_path: ${{ steps.generate.outputs.image_path }}
      caption: ${{ steps.generate.outputs.caption }}
      post_to_instagram: ${{ steps.generate.outputs.post_to_instagram }}
      post_to_facebook: ${{ steps.generate.outputs.post_to_facebook }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto libglib2.0-0 libsm6 libxext6 libxrender1 espeak-ng wget

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0"
          pip install -r requirements.txt

      - name: Setup Environment Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}" >> .env
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> .env
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}" >> .env
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> .env
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> .env
          # Instagram credentials
          echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env
          echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_APP_ID=${{ secrets.INSTAGRAM_APP_ID }}" >> .env
          echo "INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET }}" >> .env
          # Facebook credentials
          echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}" >> .env
          echo "FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}" >> .env

      - name: Generate AI Content (Image/Video)
        id: generate
        run: |
          python -c "
import os
import sys
sys.path.append('.')
import random
from datetime import datetime

# Import our content generation modules
try:
    from image_gen import generate_ai_image
    from gemini_script import pick_and_generate_script
    from config import OUTPUT_DIR
    import json
    
    os.makedirs(OUTPUT_DIR, exist_ok=True)
    
# Generate AI-themed content
    ai_topics = [
        {
