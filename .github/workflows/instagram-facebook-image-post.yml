name: Daily AI Image to Telegram (Multi-Agent)

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_topic:
        description: 'Force a specific topic (optional)'
        required: false
        type: string
      skip_verification:
        description: 'Skip image verification'
        required: false
        type: boolean
        default: false

jobs:
  # Agent 1: Topic Selection (with deduplication)
  select-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      topic: ${{ steps.select.outputs.topic }}
      audience: ${{ steps.select.outputs.audience }}
      key_points: ${{ steps.select.outputs.key_points }}
      visual_prompt: ${{ steps.select.outputs.visual_prompt }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv

      - name: Setup Environment Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Agent - Select Unique Topic
        id: select
        run: |
          python -c "
import os
import sys
import json
import random
from datetime import datetime, timedelta

sys.path.append('.')
from config import OUTPUT_DIR
os.makedirs(OUTPUT_DIR, exist_ok=True)

# Load previously used topics from a tracking file
TRACKING_FILE = os.path.join(OUTPUT_DIR, 'used_topics.json')
used_topics = set()
if os.path.exists(TRACKING_FILE):
    try:
        with open(TRACKING_FILE, 'r') as f:
            data = json.load(f)
            used_topics = set(data.get('topics', []))
    except:
        pass

# All available topics
all_topics = [
    {
        'topic': 'What is RAG in Generative AI?',
        'audience': 'Students and software professionals',
        'key_points': [
            'User Query → Embedding Model → Vector Search',
