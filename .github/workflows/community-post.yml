name: Community Post Scheduler

on:
  schedule:
    # Monday 10:00 IST (04:30 UTC)
    - cron: '30 4 * * 1'
    # Monday 16:00 IST (10:30 UTC)
    - cron: '30 10 * * 1'
    # Thursday 10:00 IST (04:30 UTC)
    - cron: '30 4 * * 4'
    # Thursday 16:00 IST (10:30 UTC)
    - cron: '30 10 * * 4'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  community-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
       
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
       
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
       
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
       
      - name: Setup YouTube Auth Files
        # We restore the JSON files from GitHub Secrets (same as shorts pipeline)
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json
          
      - name: Run Community Post
        run: |
          python community_post.py --now
        env:
          PYTHONPATH: .
       
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-post-logs
          path: logs/
          retention-days: 7