name: Community Post Scheduler

on:
  schedule:
    # Monday 10:00 IST (04:30 UTC)
    - cron: '30 4 * * 1'
    # Monday 16:00 IST (10:30 UTC)
    - cron: '30 10 * * 1'
    # Thursday 10:00 IST (04:30 UTC)
    - cron: '30 4 * * 4'
    # Thursday 16:00 IST (10:30 UTC)
    - cron: '30 10 * * 4'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  community-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Set up credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # YouTube OAuth for headless CI/CD auth
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          # Write client_secret.json for YouTube auth (use same secret as shorts pipeline)
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          
          # Export YouTube OAuth env vars for Python process
          export YOUTUBE_REFRESH_TOKEN="${YOUTUBE_REFRESH_TOKEN}"
          export YOUTUBE_CLIENT_ID="${YOUTUBE_CLIENT_ID}"
          export YOUTUBE_CLIENT_SECRET="${YOUTUBE_CLIENT_SECRET}"
          
          # Create .env file for other scripts
          cat > .env << EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_API_KEYS=${GEMINI_API_KEYS}
          NEWS_API_KEY=${NEWS_API_KEY}
          ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
          ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
          HF_TOKEN=${HF_TOKEN}
          CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
          CF_API_TOKEN=${CF_API_TOKEN}
          YOUTUBE_CLIENT_SECRET_FILE=client_secret.json
          YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
          REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
          REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
          X_API_KEY=${X_API_KEY}
          X_API_SECRET=${X_API_SECRET}
          X_ACCESS_TOKEN=${X_ACCESS_TOKEN}
          X_ACCESS_TOKEN_SECRET=${X_ACCESS_TOKEN_SECRET}
          X_BEARER_TOKEN=${X_BEARER_TOKEN}
          INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
          INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
          INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
          INSTAGRAM_BUSINESS_ACCOUNT_ID=${INSTAGRAM_BUSINESS_ACCOUNT_ID}
          IG_USER_ID=${IG_USER_ID}
          IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
          FB_PAGE_ID=${FB_PAGE_ID}
          FB_PAGE_ACCESS_TOKEN=${FB_PAGE_ACCESS_TOKEN}
          # YouTube OAuth for headless CI/CD
          YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
          YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
          YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
          EOF
      
      - name: Run Community Post
        run: |
          python community_post.py --now
        env:
          PYTHONPATH: .
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-post-logs
          path: logs/
          retention-days: 7